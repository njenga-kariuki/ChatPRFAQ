name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          LLM_PROVIDER: fake
      - run: python scripts/export_openapi.py /tmp/openapi.json && diff <(python -c "import json;print(json.dumps(json.load(open('/tmp/openapi.json')),sort_keys=True))") <(python -c "import json;print(json.dumps(json.load(open('../web/openapi.json')),sort_keys=True))")
        shell: bash
        name: openapi contract is up to date

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
