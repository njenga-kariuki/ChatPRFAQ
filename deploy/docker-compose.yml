services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatprfaq
      POSTGRES_PASSWORD: chatprfaq
      POSTGRES_DB: chatprfaq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatprfaq"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      DATABASE_URL: postgresql+asyncpg://chatprfaq:chatprfaq@db:5432/chatprfaq
      OWNER_TOKEN: ${OWNER_TOKEN:-}
      RUN_COST_CEILING_USD: ${RUN_COST_CEILING_USD:-12}
      ALLOWED_ORIGINS: '["*"]'
    ports:
      - "8000:8000"

volumes:
  pgdata:
